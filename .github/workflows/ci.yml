name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app — lint & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../db/custom.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run build

  engine:
    name: Engine & scripture parity
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../db/custom.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run engine:test
      - run: bun run redletter:verify

  audit:
    name: Dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency audit (high+)
        run: |
          npm i --package-lock-only --ignore-scripts --no-audit --silent
          npm audit --audit-level=high
      - name: Secret material scan
        run: |
          ! grep -rEn "sk_live_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude="bun.lock" .

  desktop:
    name: Rust shell — fmt, clippy, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  bridge:
    name: C# ScrollBridge — build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services-csharp/ScrollBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
